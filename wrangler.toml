name = "event-pro-casablanca"
main = "worker.ts"
compatibility_date = "2025-05-01"

[assets]
directory = "./dist"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = ["/api/*"]

[vars]
ENVIRONMENT = "production"
DEFAULT_LOCALE = "fr"
DEFAULT_CURRENCY = "MAD"
TIMEZONE = "Africa/Casablanca"

# Décommentez après avoir créé votre base D1 (`npx wrangler d1 create event_pro_db`)
# ou ajoutez le binding "DB" directement depuis Cloudflare Dashboard → Workers → Settings → Bindings :
#
# [[d1_databases]]
# binding = "DB"
# database_name = "event_pro_db"
# database_id = "VOTRE_D1_DATABASE_ID"
# migrations_dir = "migrations"

# Décommentez après avoir créé votre bucket R2 (`npx wrangler r2 bucket create event-pro-media`)
# ou ajoutez le binding "R2_BUCKET" depuis Cloudflare Dashboard → Workers → Settings → Bindings :
#
# [[r2_buckets]]
# binding = "R2_BUCKET"
# bucket_name = "event-pro-media"
